security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_users:
      entity:
        class: App\Entity\User
  role_hierarchy:
    ROLE_VOLUNTEER: ROLE_STAFF
    ROLE_VET: ROLE_STAFF
    ROLE_COORDINATOR: [ROLE_STAFF, ROLE_VOLUNTEER]
  firewalls:
    main:
      lazy: true
      provider: app_users
      form_login:
        login_path: login
        check_path: login
        enable_csrf: true
        default_target_path: after_login
      logout:
        path: logout
        target: login
        enable_csrf: true
  access_control:
    - { path: ^/admin, roles: ROLE_STAFF }
when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
