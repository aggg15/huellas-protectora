name: huellas
services:
  web:
    build: .
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Configura APP_SECRET en .env.local}
      DATABASE_URL: postgresql://${POSTGRES_USER:-huellas}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-huellas}?serverVersion=16&charset=utf8
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8086}:8000"
    volumes:
      - uploads_data:/app/var/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huellas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-huellas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database_data:
  uploads_data:
